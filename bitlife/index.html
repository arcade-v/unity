<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>BitLife - Life Simulator</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

.webgl-content {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}

#gameContainer {
  position: relative;
  width: min(100vw, 62.017vh);
  height: min(100vh, 161.246vw);
  aspect-ratio: 578 / 932;
  flex: none;
  overflow: hidden;
  background: transparent;
}

#gameContainer canvas {
  position: absolute;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  display: block;
}
.webgl-content * {
  border: 0;
  margin: 0;
  padding: 0;
}

.webgl-content .logo,
.webgl-content .progress {
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
}

.webgl-content .logo {
  background: url("logo.png") no-repeat center / contain;
  width: 130px;
  height: 130px;
}

.webgl-content .progress {
  height: 18px;
  width: 141px;
  margin-top: 90px;
}

.webgl-content .progress .empty {
  background: url("https://cdn.jsdelivr.net/gh/bit-73-life/25@main/Build/TemplateData/progressEmpty.Light.png")
    no-repeat right / cover;
  float: right;
  width: 100%;
  height: 100%;
  display: inline-block;
}

.webgl-content .progress .full {
  background: url("https://cdn.jsdelivr.net/gh/bit-73-life/25@main/Build/TemplateData/progressFull.Light.png")
    no-repeat left / cover;
  float: left;
  width: 0%;
  height: 100%;
  display: inline-block;
}

.webgl-content .logo.Dark {
  background-image: url("logo.png");
}

.webgl-content .progress.Dark .empty {
  background-image: url("TemplateData/progressEmpty.Dark.png");
}

.webgl-content .progress.Dark .full {
  background-image: url("TemplateData/progressFull.Dark.png");
}

#error {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 10px;
  right: 10px;
  bottom: 10px;
  padding: 12px;
  background: #8b0000;
  color: white;
  font: 13px monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="webgl-content">
  <div id="gameContainer"></div>
</div>

<div id="error"></div>

<script>
const cdnBases = [
      "https://cdn.jsdelivr.net/gh/arcade-v/unity@main/bitlife/",
      "https://fastly.jsdelivr.net/gh/arcade-v/unity@main/bitlife/",
      "https://testingcf.jsdelivr.net/gh/arcade-v/unity@main/bitlife/",
      "https://gcore.jsdelivr.net/gh/arcade-v/unity@main/bitlife/",
      "https://raw.githack.com/arcade-v/unity/main/bitlife/",
      "https://raw.githubusercontent.com/arcade-v/unity/main/bitlife/",
      "https://cdn.statically.io/gh/arcade-v/unity@main/bitlife/"
];

const errorBox = document.getElementById("error");

function showError(message) {
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

async function loadScriptWithFallback(path) {
  let lastError;

  for (const base of cdnBases) {
    const url = base + path;

    try {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;

        script.onload = resolve;

        script.onerror = () => {
          script.remove();
          reject(new Error("Failed to load: " + url));
        };

        document.head.appendChild(script);
      });

      console.log("Loaded:", url);
      return base;

    } catch (error) {
      console.warn(error);
      lastError = error;
    }
  }

  throw lastError || new Error("All CDN sources failed.");
}

async function loadConfigWithFallback(path) {
  let lastError;

  for (const base of cdnBases) {
    const url = base + path;

    try {
      const response = await fetch(url, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      // Validate the JSON, but preserve the original URL.
      await response.json();

      console.log("Configuration loaded:", url);
      return url;

    } catch (error) {
      console.warn("Configuration fallback:", url, error);
      lastError = error;
    }
  }

  throw lastError || new Error("Could not load BitLife.json.");
}

async function startGame() {
  try {
    // Load Unity's progress handler.
    await loadScriptWithFallback(
      "TemplateData/UnityProgress.js"
    );

    // Load the Unity WebGL loader.
    await loadScriptWithFallback(
      "Build/UnityLoader.js"
    );

    if (typeof UnityLoader === "undefined") {
      throw new Error("UnityLoader is unavailable.");
    }

    // Find a working configuration URL.
    const configUrl = await loadConfigWithFallback(
      "Build/BitLife.json"
    );

    // Start the game using the original configuration URL.
    window.unityInstance = UnityLoader.instantiate(
      "gameContainer",
      configUrl,
      {
        onProgress: function(instance, progress) {
          if (typeof UnityProgress === "function") {
            UnityProgress(instance, progress);
          }
        }
      }
    );

  } catch (error) {
    console.error("BitLife loading error:", error);
    showError(
      "Unable to load BitLife.\n\n" + error.message
    );
  }
}

startGame();
</script>

</body>
</html>
