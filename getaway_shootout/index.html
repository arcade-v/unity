<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getaway Shootout</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #586c80;
}

.webgl-content,
#gameContainer {
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 0;
  border: 0;
  position: relative;
}

#gameContainer canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

#button {
  display: none;
}

.imgb_vis {
  animation: imgb-animation 7s linear;
}

@keyframes imgb-animation {
  10% { transform: translateX(0); }
  20% { transform: translateX(100px); }
  90% { transform: translateX(100px); }
  100% { transform: translateX(0); }
}

#error {
  position: fixed;
  z-index: 1000;
  inset: auto 10px 10px;
  padding: 10px;
  color: white;
  background: #8b0000;
  font: 14px monospace;
  white-space: pre-wrap;
  display: none;
}
</style>
</head>

<body>
<div class="webgl-content">
  <div id="gameContainer"></div>
</div>

<div id="error"></div>

<script>
const cdnBases = [
      "https://cdn.jsdelivr.net/gh/arcade-v/unity@main/getaway_shootout/",
      "https://fastly.jsdelivr.net/gh/arcade-v/unity@main/getaway_shootout/",
      "https://testingcf.jsdelivr.net/gh/arcade-v/unity@main/getaway_shootout/",
      "https://gcore.jsdelivr.net/gh/arcade-v/unity@main/getaway_shootout/",
      "https://raw.githack.com/arcade-v/unity/main/getaway_shootout/",
      "https://raw.githubusercontent.com/arcade-v/unity/main/getaway_shootout/",
      "https://cdn.statically.io/gh/arcade-v/unity@main/getaway_shootout/"
];

const errorBox = document.getElementById("error");

function showError(message) {
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

async function loadScriptWithFallback(path) {
  let lastError;

  for (const base of cdnBases) {
    const url = base + path;

    try {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = resolve;
        script.onerror = () => {
          script.remove();
          reject(new Error("Failed to load " + url));
        };
        document.head.appendChild(script);
      });

      return base;
    } catch (error) {
      lastError = error;
      console.warn("CDN failed:", url, error);
    }
  }

  throw lastError || new Error("All CDN sources failed.");
}

async function loadGame() {
  try {
    // Load the progress handler.
    const progressBase = await loadScriptWithFallback(
      "TemplateData/UnityProgress.js"
    );

    // Load the legacy Unity loader.
    const loaderBase = await loadScriptWithFallback(
      "Build/UnityLoader.js"
    );

    if (typeof UnityLoader === "undefined") {
      throw new Error("UnityLoader was not initialized.");
    }

    // Try each configuration URL. Keep the successful URL intact:
    // UnityLoader uses it to resolve the game's other assets.
    let configUrl = null;
    let lastError = null;

    for (const base of cdnBases) {
      const url = base + "Build/GetawayShootoutTwoPlayerGamesOrg.json";

      try {
        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        await response.json();
        configUrl = url;
        break;
      } catch (error) {
        lastError = error;
        console.warn("Configuration CDN failed:", url, error);
      }
    }

    if (!configUrl) {
      throw lastError || new Error("Could not load the game configuration.");
    }

    let gameInstance;

    gameInstance = UnityLoader.instantiate(
      "gameContainer",
      configUrl,
      {
        onProgress: function(instance, progress) {
          if (typeof UnityProgress === "function") {
            UnityProgress(instance, progress);
          }
        },
        Module: {
          onRuntimeInitialized: function() {
            if (typeof UnityProgress === "function") {
              UnityProgress(gameInstance, "complete");
            }
          }
        }
      }
    );

    window.gameInstance = gameInstance;

  } catch (error) {
    console.error(error);
    showError("Unable to load Getaway Shootout.\n" + error.message);
  }
}

loadGame();
</script>
</body>
</html>
