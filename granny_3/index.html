<!DOCTYPE html>
<html lang="en-us">
<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap"
    rel="stylesheet"
  >
    <base href="https://cdn.jsdelivr.net/gh/arcade-v/unity/granny_3/">

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">

    <title>Granny 3 Return the School</title>

    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@200;500&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@200;500&family=MuseoModerno:wght@600&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading-cover {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: transparent;
        }

        #unity-loading-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #loading-txt {
            text-align: center;
            font-family: 'Pixelify Sans', monospace !important;
            color: white;
            font-size: clamp(20px, 5vw, 50px);
            margin: 0;
        }

        #unity-fullscreen-button {
            cursor: pointer;
        }

        #loading-error {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 10px;
            right: 10px;
            bottom: 10px;
            padding: 12px;
            background: #8b0000;
            color: white;
            font: 13px monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>

    <script>
        window.gnMathIsTheBestGameSiteEver = {
            ancestorOrigins: {},
            href: "https://html5.gamedistribution.com/",
            origin: "https://html5.gamedistribution.com",
            protocol: "https:",
            host: "html5.gamedistribution.com",
            hostname: "html5.gamedistribution.com",
            port: "",
            pathname: "/",
            search: "",
            hash: ""
        };

        // Redirect the GameDistribution SDK to the local copy.
        function redirectGameDistributionUrl(url) {
            if (
                typeof url === "string" &&
                url.includes("html5.api.gamedistribution.com/main.min.js")
            ) {
                return "main.min.js";
            }

            return url;
        }

        // Fetch interception.
        const originalFetch = window.fetch;

        window.fetch = function(...args) {
            if (typeof args[0] === "string") {
                args[0] = redirectGameDistributionUrl(args[0]);
            }

            return originalFetch.apply(this, args);
        };

        // XMLHttpRequest interception.
        const originalOpen = XMLHttpRequest.prototype.open;

        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            url = redirectGameDistributionUrl(url);
            return originalOpen.call(this, method, url, ...rest);
        };

        // Script element interception.
        const originalCreateElement = document.createElement.bind(document);

        document.createElement = function(tagName) {
            const element = originalCreateElement(tagName);

            if (tagName.toLowerCase() === "script") {
                let srcValue = "";

                Object.defineProperty(element, "src", {
                    get() {
                        return srcValue;
                    },

                    set(newSrc) {
                        srcValue = redirectGameDistributionUrl(newSrc);
                        element.setAttribute("src", srcValue);
                    },

                    configurable: true,
                    enumerable: true
                });
            }

            return element;
        };
    </script>
</head>

<body class="dark">

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="loading-cover">
        <div id="unity-loading-bar">
            <div id="unity-logo">
                <img src="logo.png" alt="Granny 3">
                <p id="loading-txt">Loading...</p>
            </div>

            <div id="unity-progress-bar-empty" style="display:none;">
                <div id="unity-progress-bar-full"></div>
            </div>

            <div class="spinner"></div>
        </div>
    </div>

    <div id="unity-fullscreen-button" style="display:none;"></div>
    <div id="loading-error"></div>

<script>
const CDN_BASES = [
      "https://cdn.jsdelivr.net/gh/arcade-v/unity@main/granny_3/",
      "https://fastly.jsdelivr.net/gh/arcade-v/unity@main/granny_3/",
      "https://testingcf.jsdelivr.net/gh/arcade-v/unity@main/granny_3/",
      "https://gcore.jsdelivr.net/gh/arcade-v/unity@main/granny_3/",
      "https://raw.githack.com/arcade-v/unity/main/granny_3/",
      "https://raw.githubusercontent.com/arcade-v/unity/main/granny_3/",
      "https://cdn.statically.io/gh/arcade-v/unity@main/granny_3/"
];

const BUILD_PATH = "Build/";

const canvas = document.getElementById("unity-canvas");
const container = document.getElementById("unity-container");
const loadingCover = document.getElementById("loading-cover");
const loadingText = document.getElementById("loading-txt");
const progressBarEmpty = document.getElementById("unity-progress-bar-empty");
const progressBarFull = document.getElementById("unity-progress-bar-full");
const fullscreenButton = document.getElementById("unity-fullscreen-button");
const spinner = document.querySelector(".spinner");
const errorBox = document.getElementById("loading-error");

let loadedBytes = 0;
let unityInstance = null;
let blobUrls = [];

const hideFullScreenButton = false;

// Format downloaded byte count.
function formatSize(bytes) {
    if (bytes >= 1024 * 1024 * 1024) {
        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    if (bytes >= 1024 * 1024) {
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    if (bytes >= 1024) {
        return (bytes / 1024).toFixed(2) + " KB";
    }

    return bytes + " B";
}

// Update download status.
function updateLoadingText(message) {
    loadingText.textContent = message;
}

function updateDownloadProgress() {
    updateLoadingText(
        "LOADING... " + formatSize(loadedBytes) + " downloaded"
    );
}

// Display fatal errors.
function showError(error) {
    console.error("Granny 3 loading error:", error);

    errorBox.style.display = "block";
    errorBox.textContent =
        "Unable to load Granny 3.\n\n" +
        (error.message || String(error));

    updateLoadingText("Loading failed.");
}

// Load a script from a URL.
function loadScript(url) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = url;

        script.onload = () => resolve();

        script.onerror = () => {
            script.remove();
            reject(new Error("Script failed: " + url));
        };

        document.head.appendChild(script);
    });
}

// Load a script with CDN fallbacks.
async function loadScriptWithFallback(path, checkFunction) {
    let lastError;

    for (const base of CDN_BASES) {
        const url = base + path;

        try {
            await loadScript(url);

            if (checkFunction && !checkFunction()) {
                throw new Error("Required Unity function was not found.");
            }

            console.log("Script loaded:", url);
            return base;

        } catch (error) {
            console.warn("Script CDN failed:", url, error);
            lastError = error;
        }
    }

    throw lastError || new Error("All script CDNs failed: " + path);
}

// Fetch a file with CDN fallbacks and download progress.
async function fetchWithFallback(path) {
    let lastError;

    for (const base of CDN_BASES) {
        const url = base + path;
        let received = 0;

        try {
            console.log("Downloading:", url);

            const response = await fetch(url, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            let result;

            if (response.body && response.body.getReader) {
                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    chunks.push(value);
                    received += value.byteLength;
                    loadedBytes += value.byteLength;

                    updateDownloadProgress();
                }

                const combined = new Uint8Array(received);
                let offset = 0;

                for (const chunk of chunks) {
                    combined.set(chunk, offset);
                    offset += chunk.byteLength;
                }

                result = combined.buffer;

            } else {
                result = await response.arrayBuffer();
                received = result.byteLength;
                loadedBytes += received;
                updateDownloadProgress();
            }

            console.log(
                "Downloaded:",
                path,
                formatSize(received)
            );

            return result;

        } catch (error) {
            // Remove partial progress before trying another CDN.
            loadedBytes = Math.max(0, loadedBytes - received);

            console.warn("Download fallback:", url, error);
            lastError = error;
        }
    }

    throw lastError || new Error("All CDNs failed for " + path);
}

// Generate split-file paths.
function getParts(file, count) {
    const parts = [];

    for (let i = 1; i <= count; i++) {
        parts.push(file + ".part" + i);
    }

    return parts;
}

// Download and merge split files.
async function mergeFiles(parts, label) {
    const buffers = [];

    for (let i = 0; i < parts.length; i++) {
        updateLoadingText(
            "Downloading " + label + " (" +
            (i + 1) + "/" + parts.length + ")..."
        );

        const buffer = await fetchWithFallback(parts[i]);
        buffers.push(buffer);
    }

    updateLoadingText("Combining " + label + "...");

    const blob = new Blob(buffers, {
        type: "application/octet-stream"
    });

    const blobUrl = URL.createObjectURL(blob);
    blobUrls.push(blobUrl);

    return blobUrl;
}

// Unity initialization.
async function initializeGame() {
    try {
        // Mobile viewport adjustments.
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement("meta");

            meta.name = "viewport";
            meta.content =
                "width=device-width, height=device-height, " +
                "initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

            document.head.appendChild(meta);

            container.className = "unity-mobile";
        }

        // Load Unity loader.
        updateLoadingText("Loading Unity loader...");

        const loaderBase = await loadScriptWithFallback(
            BUILD_PATH + "v1.loader.js",
            () => typeof createUnityInstance === "function"
        );

        // Download split data and WASM files.
        const dataParts = getParts(
            BUILD_PATH + "v1.data.unityweb",
            4
        );

        const wasmParts = getParts(
            BUILD_PATH + "v1.wasm.unityweb",
            1
        );

        const [dataUrl, wasmUrl] = await Promise.all([
            mergeFiles(dataParts, "DATA"),
            mergeFiles(wasmParts, "WASM")
        ]);

        // Construct the Unity configuration.
        const config = {
            dataUrl: dataUrl,

            frameworkUrl:
                loaderBase + BUILD_PATH + "v1.framework.js.unityweb",

            codeUrl: wasmUrl,

            streamingAssetsUrl:
                loaderBase + BUILD_PATH + "StreamingAssets/",

            companyName: "Kiz10",
            productName: "Granny 3 Return the School",
            productVersion: "0.0.12"
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            config.devicePixelRatio = 1.5;
        }

        // Start Unity.
        updateLoadingText("Starting Granny 3...");

        progressBarEmpty.style.display = "";

        unityInstance = await createUnityInstance(
            canvas,
            config,
            function(progress) {
                if (spinner) {
                    spinner.style.display = "none";
                }

                progressBarFull.style.width =
                    (progress * 100) + "%";

                updateLoadingText(
                    "Initializing... " +
                    Math.round(progress * 100) + "%"
                );
            }
        );

        window.unityInstance = unityInstance;

        // Hide loading screen.
        loadingCover.style.display = "none";

        // Enable fullscreen.
        if (!hideFullScreenButton) {
            fullscreenButton.style.display = "";

            fullscreenButton.onclick = function() {
                unityInstance.SetFullscreen(1);
            };
        }

        console.log("Granny 3 loaded successfully.");

    } catch (error) {
        showError(error);
    }
}

// Release Blob URLs when leaving the page.
window.addEventListener("pagehide", function() {
    for (const url of blobUrls) {
        URL.revokeObjectURL(url);
    }
});

// Start.
initializeGame();
</script>

</body>
</html>
